  <script>
    (function () {
      function start() {
        if (typeof rodajaAlertasBoot !== "function") {
          var g = document.getElementById("al-gate");
          if (g) {
            g.hidden = false;
            g.innerHTML = "<h1>Panel de alertas</h1><p>No se pudo cargar. Recarga la p\u00e1gina.</p>";
          }
          return;
        }
        try {
          var p = rodajaAlertasBoot();
          if (p && typeof p.catch === "function") {
            p.catch(function (err) { console.error(err); });
          }
        } catch (err) {
          console.error(err);
        }
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
      else start();
    })();
