    location = / {
        absolute_redirect off;
        if ($rodaja_mi_reporte_from_explorador != "") {
            return 302 $rodaja_mi_reporte_from_explorador;
        }
        if ($is_args) {
            return 302 /explorador/$is_args$args;
        }
        rewrite ^ /portada/index.html last;
    }
    location = /index.html {
        return 302 /;
    }
    # internamente, solo desde location = /; /portada/ no se publica.
    location = /portada/index.html {
        internal;
        ssi on;
        root /usr/share/nginx/html;
        default_type text/html;
    }
    location / {
        limit_req zone=shiny_deeplink burst=10 nodelay;
        limit_req zone=shiny_general burst=200 nodelay;
        # $shiny_backend from http-level map (sticky cookie rodaja_shiny)
        proxy_pass http://$shiny_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Set-Cookie "rodaja_shiny=$shiny_route; Path=/; Max-Age=86400; SameSite=Lax" always;
    }
